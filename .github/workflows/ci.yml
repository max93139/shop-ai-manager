name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint and Type Check
        run: |
          pnpm lint
          pnpm check-types

      - name: Build All Packages
        run: pnpm build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/shop_ai
          JWT_SECRET: ci-test-secret-at-least-32-chars-long-123456
          BOT_TOKEN: ci-dummy-bot-token

      - name: API end-to-end tests
        run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop_ai_test
